<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    .form-control.is-invalid, .form-select.is-invalid {
      border-color: #dc3545;
      background-image: none;
    }
    .form-control.is-invalid::after,
    .form-select.is-invalid::after {
      content: "\f06a";
      font-family: "Font Awesome 5 Free";
      font-weight: 900;
      color: #dc3545;
      position: absolute;
      right: 15px;
      top: calc(50% - 0.5em);
    }
  </style>
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
  <form id="customForm" class="needs-validation" novalidate>
    <!-- Name -->
    <div class="mb-3 position-relative">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" required>
      <div class="invalid-feedback">Name is required</div>
    </div>

    <!-- Email -->
    <div class="mb-3 position-relative">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required>
      <div class="invalid-feedback">Email is required</div>
    </div>

    <!-- Password -->
    <div class="mb-3 position-relative">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required>
      <div class="invalid-feedback">Password is required</div>
    </div>

    <!-- Hobbies -->
    <div class="mb-4 position-relative">
      <label for="hobbies" class="form-label">Hobbies</label>
      <select class="form-select" id="hobbies" required>
        <option value="">Select hobby</option>
        <option value="reading">Reading</option>
        <option value="music">Music</option>
        <option value="sports">Sports</option>
      </select>
      <div class="invalid-feedback">Please select a hobby</div>
    </div>

    <!-- Submit -->
    <button class="btn btn-danger w-100" type="submit">Submit</button>
  </form>
</div>

<script>
  (() => {
    'use strict';
    const form = document.getElementById('customForm');
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
