    <style>
        table {
            width: 100%;
            background-color: rgb(143, 212, 212);
}
    table,th,td{
        
  border: 2px solid white;
  border-collapse: collapse;
    }
    </style>
</head>

        </tr>
        <tr>

            <td>94</td>
        </tr>
        <tr>
            <td>John</td>

        </tr>

</body>
</html>
